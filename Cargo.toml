[package]
name = "document-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.7"
axum-embed = "0.1.0"
clap = { version = "4.5.20", features = ["derive"] }
rust-embed = "8.5.0"
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0.132"
tokio = { version = "1.41.0", features = ["rt", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.1", features = ["timeout"] }

[build-dependencies]
build-deps = "0.1.4"

[features]
local = []
next = []
prd = []

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true

[profile.production]
inherits = "release"
codegen-units = 1
