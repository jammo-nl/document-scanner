<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="bg-blue-900 sticky top-0 w-full shadow-md">
      <nav class="container mx-auto px-6 py-3">
        <div class="flex justify-between items-center">
          <a href="#" class="text-2xl font-bold text-white">Document Scanner</a>
          <div class="flex space-x-4">
            <button
              id="document-new"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold rounded-full h-14 w-14 flex items-center justify-center text-xl"
            >
              <i class="fa-regular fa-file"></i></button
            ><button
              id="document-export"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold rounded-full h-14 w-14 flex items-center justify-center text-xl"
            >
              <i class="fa-regular fa-floppy-disk"></i>
            </button>
          </div>
        </div>
      </nav>
    </header>

    <div class="container mx-auto px-4 mt-2 flex flex-wrap">
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">a</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">b</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">c</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">d</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">e</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">f</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">g</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">h</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">i</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">j</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">k</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">l</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">m</div>
      <div class="overflow-hidden shadow-lg flex-none w-64 h-80 m-5">n</div>
    </div>

    <div class="qr-overlay qr-state"></div>
    <div class="qr-code qr-state"><canvas id="qrcode"></canvas></div>

    <div
      class="fixed inset-0 flex items-center justify-center z-50 backdrop-blur confirm-dialog"
    >
      <div
        class="relative px-4 min-h-screen md:flex md:items-center md:justify-center"
      >
        <div class="opacity-25 w-full h-full absolute z-10 inset-0"></div>
        <div
          class="bg-white rounded-lg md:max-w-md md:mx-auto p-4 fixed inset-x-0 bottom-0 z-50 mb-4 mx-4 md:relative shadow-lg"
        >
          <div class="md:flex items-center">
            <div
              class="rounded-full border border-gray-300 flex items-center justify-center w-16 h-16 flex-shrink-0 mx-auto"
            >
              <i class="bx bx-error text-3xl"> &#9888; </i>
            </div>
            <div class="mt-4 md:mt-0 md:ml-6 text-center md:text-left">
              <p class="font-bold">Warning!</p>
              <p class="text-sm text-gray-700 mt-1">
                By starting a new document you will lose all unsaved data. Are
                you sure you want to start a new document?
              </p>
            </div>
          </div>
          <div class="text-center md:text-right mt-4 md:flex md:justify-end">
            <button
              id="confirm-delete-btn"
              class="block w-full md:inline-block md:w-auto px-4 py-3 md:py-2 bg-red-200 text-red-700 rounded-lg font-semibold text-sm md:ml-2 md:order-2"
            >
              New
            </button>
            <button
              id="confirm-cancel-btn"
              class="block w-full md:inline-block md:w-auto px-4 py-3 md:py-2 bg-gray-200 rounded-lg font-semibold text-sm mt-4 md:mt-0 md:order-1"
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
